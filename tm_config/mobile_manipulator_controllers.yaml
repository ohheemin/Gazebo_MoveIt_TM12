/mobile_manipulator:
  controller_manager:
    ros__parameters:
      update_rate: 100

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      joint_position_example_controller:
        type: arm_controllers/JointPositionExampleController

      diff_drive_controller:
        type: diff_drive_controller/DiffDriveController

  joint_position_example_controller:
    ros__parameters:
      joints:
        - joint_1
        - joint_2
        - joint_3
        - joint_4
        - joint_5
        - joint_6
      command_interfaces:
        - position
      state_interfaces:
        - position

  diff_drive_controller:
    ros__parameters:
      left_wheel_names: ["wheel_left_joint"]
      right_wheel_names: ["wheel_right_joint"]
      wheel_separation: 0.3982
      wheel_radius: 0.09684
      odom_frame_id: odom
      base_frame_id: base_link
      publish_rate: 30.0
      enable_odom_tf: true
      use_stamped_vel: false
      pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]
      twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]
      cmd_vel_timeout: 0.5
      max_wheel_angular_velocity: 10.0
